<!doctype html>
<html lang="en">
  <head>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Font Finder</title>
  </head>

  <body>

    <button class="back-to-niagara" onclick="goBackToNiagara()">
      ← Back to Niagara Laser
    </button>

    <div id="root"></div>

    <!-- Your React/Vite app -->
    <script type="module" src="/src/main.tsx"></script>

    <!-- Back button logic -->
    <script>
      function goBackToNiagara() {
        if (document.referrer) {
          window.history.back();
        } else {
          window.location.href = "https://niagaralaser.vercel.app/";
        }
      }
    </script>

  </body>
</html>
